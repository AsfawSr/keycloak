# APPLICATION
spring.application.name=spring-app
server.port=8080

# KEYCLOAK - OAuth2 Resource Server
# For JWT validation (REQUIRED)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/myrealm

# KEYCLOAK - Admin Client Config (For Feign Client)

keycloak.auth-server-url=http://localhost:8081
keycloak.realm=myrealm
keycloak.admin-client-id=admin-cli
keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}

# KEYCLOAK - App Client (For login/register)
app.keycloak.client-id=spring-app
app.keycloak.client-secret=${KEYCLOAK_APP_CLIENT_SECRET}

# SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.max-age=86400
server.servlet.session.timeout=24h

# FEIGN
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=10000
feign.client.config.default.logger-level=full

# LOGGING
logging.level.com.asfaw.keycloak=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.feign=DEBUG

# TOKEN DOWNSCOPING
app.keycloak.downscope.enabled=true
app.keycloak.downscope.default-expiration=3600
app.keycloak.downscope.max-expiration=7200
app.keycloak.downscope.audience-prefix=microservice-

# SERVICE SCOPES & ROLES (externalized from code)
app.keycloak.services.scopes.order-service=read:orders,write:orders
app.keycloak.services.scopes.payment-service=read:payments,write:payments
app.keycloak.services.scopes.user-service=read:users,write:users
app.keycloak.services.scopes.inventory-service=read:inventory,write:inventory
app.keycloak.services.scopes.notification-service=send:notifications

app.keycloak.services.roles.order-service=ORDER_USER,ORDER_ADMIN
app.keycloak.services.roles.payment-service=PAYMENT_USER,PAYMENT_ADMIN
app.keycloak.services.roles.user-service=USER_MANAGER
app.keycloak.services.roles.admin-service=ADMIN,SUPER_ADMIN

# RATE LIMITING (Resilience4j) - 20 requests per minute per instance
resilience4j.ratelimiter.instances.downscopeToken.limit-for-period=20
resilience4j.ratelimiter.instances.downscopeToken.limit-refresh-period=60s
resilience4j.ratelimiter.instances.downscopeToken.timeout-duration=0s